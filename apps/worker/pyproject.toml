[project]
name = "glimpse-worker"
version = "0.1.0"
description = "Glimpse face-processing worker: YuNet detection + SFace recognition, Postgres job queue."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "opencv-python-headless>=4.10",
  "numpy>=2.0",
  "pillow>=11.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "boto3>=1.35",
  "pydantic-settings>=2.5",
]

[project.scripts]
glimpse-face = "glimpse_worker.cli:main"

[dependency-groups]
dev = ["ruff>=0.8", "mypy>=1.13", "pytest>=8.3", "httpx>=0.27", "boto3-stubs[s3]>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glimpse_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "E501"]
"eval/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
packages = ["glimpse_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
